name: macOS and Windows checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Python subtitle and installer tests
        run: |
          python -m pip install numpy
          python -m unittest discover -s tests -v
      - name: Panel workflow and bundled model default
        run: node tests/test_panel_workflow.js --windows --buyer
      - name: After Effects host script
        run: node tests/test_after_effects_composer.js
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Install-Windows.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
