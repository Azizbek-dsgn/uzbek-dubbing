name: macOS and Windows checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Python subtitle and installer tests
        run: |
          python -m pip install numpy "av>=16,<17" imageio-ffmpeg==0.6.0
          python -m unittest discover -s tests -v
      - name: Panel workflow and bundled model default
        run: node tests/test_panel_workflow.js --windows --buyer
      - name: After Effects host script
        run: |
          node tests/test_after_effects_composer.js
          node tests/test_podcast_host.js
          node tests/test_podcast_panel.js
          node tests/test_reels_panel.js
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('Install-Windows.ps1', 'Install-Windows-online.ps1', 'bootstrap-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Windows bootstrap archive smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'uzscribe-fixture'
          $source = Join-Path $fixture 'checkout'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          'print("Windows bootstrap source executed")' | Set-Content (Join-Path $source 'install_online.py')
          $env:UZSCRIBE_ARCHIVE_PATH = Join-Path $fixture 'source.zip'
          Compress-Archive -Path $source -DestinationPath $env:UZSCRIBE_ARCHIVE_PATH
          $env:UZSCRIBE_FORCE_MANAGED_PYTHON = '1'
          & ./bootstrap-windows.ps1
          Remove-Item Env:UZSCRIBE_FORCE_MANAGED_PYTHON
          Remove-Item Env:UZSCRIBE_ARCHIVE_PATH
          $env:UZSCRIBE_SOURCE_DIR = $source
          $env:PSModulePath = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\Modules'
          cmd.exe /d /s /c 'powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw bootstrap-windows.ps1 | Invoke-Expression"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh install with both models and actual CPU inference
        shell: bash
        run: |
          python -m pip install uv
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          from unittest.mock import patch
          import install_online
          root = Path(os.environ['RUNNER_TEMP']) / 'uzscribe-fresh-install'
          paths = lambda *args: (root / 'runtime', root / 'panel')
          os.environ['UZSCRIBE_UV_BIN'] = shutil.which('uv')
          with patch('install.destinations', paths), patch('install_online.destinations', paths), patch('install_online._enable_debug'):
              result = install_online.main()
          if result:
              sys.exit(result)
          import subprocess
          python = install_online._python_for(root / 'runtime', sys.platform)
          subprocess.run([str(python), 'tools/verify_podcast.py'], check=True)
          subprocess.run([str(python), 'tools/verify_reels.py', '--runtime', str(root / 'runtime')], check=True)
          PY
      - name: Windows failed uv download leaves PowerShell open and writes a log
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'uzscribe-failure-source'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          'print("unexpected install")' | Set-Content (Join-Path $source 'install_online.py')
          $env:UZSCRIBE_SOURCE_DIR = $source
          $env:UV_DOWNLOAD_URL = 'http://127.0.0.1:9'
          try {
            & ./bootstrap-windows.ps1
            throw 'Expected uv failure did not occur.'
          } catch {
            if ($_.Exception.Message -eq 'Expected uv failure did not occur.') { throw }
          } finally {
            Remove-Item Env:UZSCRIBE_SOURCE_DIR
            Remove-Item Env:UV_DOWNLOAD_URL
          }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'UzbekSubtitles/install.log'))) {
            throw 'Install log was not saved.'
          }
          $global:LASTEXITCODE = 0
      - name: macOS failed install saves its log
        if: runner.os == 'macOS'
        run: |
          if UZSCRIBE_SOURCE_DIR="$RUNNER_TEMP/missing-source" bash bootstrap-mac.sh; then
            echo 'Expected install failure did not occur.' >&2
            exit 1
          fi
          test -s "$HOME/Library/Application Support/UzbekSubtitles/install.log"
      - name: macOS bootstrap archive smoke test
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/uzscribe-fixture/checkout"
          printf 'print("macOS bootstrap source executed")\n' > "$RUNNER_TEMP/uzscribe-fixture/checkout/install_online.py"
          tar -czf "$RUNNER_TEMP/uzscribe-fixture/source.tar.gz" -C "$RUNNER_TEMP/uzscribe-fixture" checkout
          UZSCRIBE_FORCE_MANAGED_PYTHON=1 UZSCRIBE_ARCHIVE_PATH="$RUNNER_TEMP/uzscribe-fixture/source.tar.gz" bash bootstrap-mac.sh
          UZSCRIBE_SOURCE_DIR="$RUNNER_TEMP/uzscribe-fixture/checkout" bash bootstrap-mac.sh
