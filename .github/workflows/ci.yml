name: macOS and Windows checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Python subtitle and installer tests
        run: |
          python -m pip install numpy
          python -m unittest discover -s tests -v
      - name: Panel workflow and bundled model default
        run: node tests/test_panel_workflow.js --windows --buyer
      - name: After Effects host script
        run: node tests/test_after_effects_composer.js
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('Install-Windows.ps1', 'Install-Windows-online.ps1', 'bootstrap-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Windows bootstrap archive smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'uzscribe-fixture'
          $source = Join-Path $fixture 'checkout'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          'print("Windows bootstrap source executed")' | Set-Content (Join-Path $source 'install_online.py')
          $env:UZSCRIBE_ARCHIVE_PATH = Join-Path $fixture 'source.zip'
          Compress-Archive -Path $source -DestinationPath $env:UZSCRIBE_ARCHIVE_PATH
          . ./bootstrap-windows.ps1
      - name: macOS bootstrap archive smoke test
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/uzscribe-fixture/checkout"
          printf 'print("macOS bootstrap source executed")\n' > "$RUNNER_TEMP/uzscribe-fixture/checkout/install_online.py"
          tar -czf "$RUNNER_TEMP/uzscribe-fixture/source.tar.gz" -C "$RUNNER_TEMP/uzscribe-fixture" checkout
          UZSCRIBE_ARCHIVE_PATH="$RUNNER_TEMP/uzscribe-fixture/source.tar.gz" bash bootstrap-mac.sh
